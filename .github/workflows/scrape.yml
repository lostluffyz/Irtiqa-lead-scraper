name: Google Maps Scrape

on:
  workflow_dispatch:
    inputs:
      scrape_job_id:
        description: 'Scrape job ID (canonical identifier from Vercel)'
        required: true
        type: string
      query:
        description: 'Search query (e.g. "software companies")'
        required: true
        type: string
      location:
        description: 'Location (e.g. "Germany")'
        required: true
        type: string
      requested_count:
        description: 'Maximum number of leads to request'
        required: true
        type: number
      extract_emails:
        description: 'Extract emails from business websites'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (no database writes)'
        required: false
        type: boolean
        default: true
      depth:
        description: 'How far the tool scrolls the results list (1-10)'
        required: false
        type: string
        default: "2"
      require_contact:
        description: 'Drop rows with no valid phone and no email'
        required: false
        type: string
        default: "false"
      country_allowlist:
        description: 'Comma-separated 2-letter country codes to keep (empty = no filter)'
        required: false
        type: string
        default: ""
      skip_closed:
        description: 'Drop permanently closed businesses'
        required: false
        type: string
        default: "false"

# NOTE: no workflow-level `concurrency:` group. Overlapping dispatches run
# as independent runs; cross-job dedupe races are possible (only the
# place-id unique index backstops them), so dispatch sequentially.

# Pinned by digest from run #9 (2026-10-11). To upgrade: take the new digest from a successful run log, dry-run it, then change this line.
env:
  SCRAPER_IMAGE: gosom/google-maps-scraper@sha256:e205c02913c5a69c16fc2094b8e5b194a2f655166d2c1126d50548d216e6b1b2

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create output directory
        run: mkdir -p results

      - name: Validate inputs
        env:
          DEPTH_INPUT: ${{ inputs.depth }}
        run: |
          if ! echo "$DEPTH_INPUT" | grep -Eq '^[0-9]+$'; then
            echo "ERROR: depth must be a positive integer (got '$DEPTH_INPUT')" >&2
            exit 1
          fi
          DEPTH="$DEPTH_INPUT"
          if [ "$DEPTH" -lt 1 ]; then DEPTH=1; fi
          if [ "$DEPTH" -gt 10 ]; then DEPTH=10; fi
          if [ "$DEPTH" != "$DEPTH_INPUT" ]; then
            echo "depth clamped to $DEPTH (valid range is 1-10)"
          fi
          echo "DEPTH=$DEPTH" >> "$GITHUB_ENV"

      - name: Build query file
        env:
          QUERY: ${{ inputs.query }}
          LOCATION: ${{ inputs.location }}
        run: |
          echo "$QUERY in $LOCATION" > queries.txt
          echo "=== Query ==="
          cat queries.txt

      - name: Validate scraper image digest
        env:
          SCRAPER_IMAGE: ${{ env.SCRAPER_IMAGE }}
        run: |
          if ! echo "$SCRAPER_IMAGE" | grep -Eq '^gosom/google-maps-scraper@sha256:[0-9a-f]{64}$'; then
            echo "ERROR: SCRAPER_IMAGE must match ^gosom/google-maps-scraper@sha256:[0-9a-f]{64}$ (got '$SCRAPER_IMAGE')" >&2
            exit 1
          fi

      - name: Run Google Maps Scraper
        timeout-minutes: 20
        env:
          DEPTH: ${{ env.DEPTH }}
          EXTRACT_EMAILS: ${{ inputs.extract_emails }}
          SCRAPER_IMAGE: ${{ env.SCRAPER_IMAGE }}
        run: |
          EMAIL_FLAG=""
          if [ "$EXTRACT_EMAILS" = "true" ]; then EMAIL_FLAG="-email"; fi
          docker run \
            -v gmaps-playwright-cache:/opt \
            -v "$PWD/queries.txt:/queries.txt:ro" \
            -v "$PWD/results:/out" \
            "$SCRAPER_IMAGE" \
            -input /queries.txt \
            -results /out/results.json \
            -json \
            -depth "$DEPTH" \
            -c 2 \
            -pages-per-browser 2 \
            -exit-on-inactivity 5m \
            $EMAIL_FLAG
        continue-on-error: true

      - name: Check scraper output
        run: |
          if [ ! -f results/results.json ]; then
            echo "WARNING: No results.json produced"
            echo "[]" > results/results.json
          fi
          echo "=== Results preview ==="
          wc -l results/results.json || true
          head -c 2000 results/results.json || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ingestion dependencies
        run: cd scripts && npm ci

      - name: Run ingestion script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPE_JOB_ID: ${{ inputs.scrape_job_id }}
          REQUESTED_COUNT: ${{ inputs.requested_count }}
          DRY_RUN: ${{ inputs.dry_run }}
          REQUIRE_CONTACT: ${{ inputs.require_contact }}
          COUNTRY_ALLOWLIST: ${{ inputs.country_allowlist }}
          SKIP_CLOSED: ${{ inputs.skip_closed }}
        run: |
          node scripts/ingest.js \
            --scrape-job-id "$SCRAPE_JOB_ID" \
            --input results/results.json \
            --requested "$REQUESTED_COUNT" \
            --dry-run "$DRY_RUN" \
            --require-contact "$REQUIRE_CONTACT" \
            --country-allowlist "$COUNTRY_ALLOWLIST" \
            --skip-closed "$SKIP_CLOSED"

      - name: Mark stale job as failed
        if: always()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPE_JOB_ID: ${{ inputs.scrape_job_id }}
        run: node scripts/mark-failed.js --job-id "$SCRAPE_JOB_ID"
