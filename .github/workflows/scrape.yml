name: Google Maps Scrape

on:
  workflow_dispatch:
    inputs:
      scrape_job_id:
        description: 'Scrape job ID (canonical identifier from Vercel)'
        required: true
        type: string
      query:
        description: 'Search query (e.g. "software companies")'
        required: true
        type: string
      location:
        description: 'Location (e.g. "Germany")'
        required: true
        type: string
      requested_count:
        description: 'Maximum number of leads to request'
        required: true
        type: number
      extract_emails:
        description: 'Extract emails from business websites'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (no database writes)'
        required: false
        type: boolean
        default: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create output directory
        run: mkdir -p results

      - name: Build query file
        run: |
          echo "${{ inputs.query }} in ${{ inputs.location }}" > queries.txt
          echo "=== Query ==="
          cat queries.txt

      - name: Run Google Maps Scraper
        run: |
          docker run \
            -v gmaps-playwright-cache:/opt \
            -v "$PWD/queries.txt:/queries.txt:ro" \
            -v "$PWD/results:/out" \
            gosom/google-maps-scraper \
            -input /queries.txt \
            -results /out/results.json \
            -json \
            -depth 2 \
            -c 2 \
            -pages-per-browser 2 \
            -exit-on-inactivity 5m \
            ${{ inputs.extract_emails && '-email' || '' }}
        continue-on-error: true

      - name: Check scraper output
        run: |
          if [ ! -f results/results.json ]; then
            echo "WARNING: No results.json produced"
            echo "[]" > results/results.json
          fi
          echo "=== Results preview ==="
          wc -l results/results.json || true
          head -c 2000 results/results.json || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ingestion dependencies
        run: cd scripts && npm ci

      - name: Run ingestion script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/ingest.js \
            --scrape-job-id "${{ inputs.scrape_job_id }}" \
            --input results/results.json \
            --requested "${{ inputs.requested_count }}" \
            --dry-run "${{ inputs.dry_run }}"
